plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration are bundled into the mod jar by Shadow.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Local content mods, matching the 1.21.1 Fabric builds.
    modImplementation files(rootProject.file('libs/alexsmobs-2.2.2-fabric+1.21.1.jar'))
    modImplementation files(rootProject.file('libs/FarmersDelight-1.21.1-3.3.6+refabricated.jar'))

    // JEI is optional and never bundled.
    modCompileOnly files(rootProject.file('libs/jei-1.21.1-fabric-19.56.0.439.jar'))
    modLocalRuntime files(rootProject.file('libs/jei-1.21.1-fabric-19.56.0.439.jar'))

    // Jade is optional and never bundled; the plugin is only loaded through the "jade" entrypoint.
    modCompileOnly files(rootProject.file('libs/Jade-1.21.1-Fabric-15.10.6.jar'))
    modLocalRuntime files(rootProject.file('libs/Jade-1.21.1-Fabric-15.10.6.jar'))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
