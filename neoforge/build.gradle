plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration are bundled into the mod jar by Shadow.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Local content mods, matching the 1.21.1 NeoForge builds.
    modImplementation files(rootProject.file('libs/alexsmobs-2.2.2-neoforge+1.21.1.jar'))
    modImplementation files(rootProject.file('libs/FarmersDelight-1.21.1-1.3.4.jar'))

    // JEI is optional and never bundled.
    modCompileOnly files(rootProject.file('libs/jei-1.21.1-neoforge-19.56.0.439.jar'))
    modLocalRuntime files(rootProject.file('libs/jei-1.21.1-neoforge-19.56.0.439.jar'))

    // Jade is optional and never bundled; the shared plugin is found through @WailaPlugin.
    modCompileOnly files(rootProject.file('libs/Jade-1.21.1-NeoForge-15.10.6.jar'))
    modLocalRuntime files(rootProject.file('libs/Jade-1.21.1-NeoForge-15.10.6.jar'))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
